# macOS environment (E5) zero-quota qualification — docs/VERSIONS.md E5.
#
# This workflow installs the exact candidate runtimes, runs the real macOS
# adapter conformance battery, performs the same no-model preflight used by
# the other four environments, and proves all 36 V2 oracle completions.  It
# does not provision credentials or invoke an agent model.  A separate,
# explicitly authorized analysis-excluded smoke is still required for D-007.

name: macOS env (E5) qualification

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "analysis/d013_oracle_qualification.py"
      - "config/v2-runtime-matrix.candidate.json"
      - "harness/environments/macos_actions.py"
      - "scripts/collection_preflight.py"
      - "tasks/v2/**"
      - "tests/test_d013_oracle_qualification.py"
      - "tests/test_macos_actions_conformance.py"
      - ".github/workflows/macos-actions-smoke.yml"

permissions:
  contents: read

jobs:
  macos-e5-qualification:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
      DISABLE_FEEDBACK_COMMAND: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Set up exact Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install exact Claude and Codex CLIs
        run: |
          npm install --global \
            @anthropic-ai/claude-code@2.1.231 \
            @openai/codex@0.147.0

      - name: Install checksum-pinned agy CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google-antigravity/antigravity-cli/releases/download/1.1.13/agy_cli_mac_arm64.tar.gz \
            --output "$RUNNER_TEMP/agy_cli_mac_arm64.tar.gz"
          printf '%s  %s\n' \
            f8c27b70708843eeb2c8f6efff0119a27041980e95cba6c49b86a0950ed19ba1 \
            "$RUNNER_TEMP/agy_cli_mac_arm64.tar.gz" | shasum -a 256 --check
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/agy-extract"
          tar -xzf "$RUNNER_TEMP/agy_cli_mac_arm64.tar.gz" \
            -C "$RUNNER_TEMP/agy-extract"
          install -m 0755 "$RUNNER_TEMP/agy-extract/antigravity" \
            "$HOME/.local/bin/agy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exact runtime versions
        run: |
          node --version
          python --version
          claude --version
          codex --version
          agy --version

      - name: macOS adapter conformance
        run: python -m pytest tests/test_macos_actions_conformance.py -q

      - name: Exact zero-quota collection preflight
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/collection_preflight.py" \
            --env macos_actions \
            --matrix "$GITHUB_WORKSPACE/config/v2-runtime-matrix.candidate.json" \
            --output "$RUNNER_TEMP/preflight-macos.json"

      - name: All 36 portable oracle completions
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/analysis/d013_oracle_qualification.py" \
            --env macos_actions \
            --output "$RUNNER_TEMP/d013-oracles-macos.json"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e5-zero-quota-qualification
          path: |
            ${{ runner.temp }}/preflight-macos.json
            ${{ runner.temp }}/d013-oracles-macos.json
          if-no-files-found: error
