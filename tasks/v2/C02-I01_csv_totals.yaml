id: C02-I01
family_id: C02
instance_id: I01
category: capability
difficulty: candidate
title: "Aggregate quoted CSV records by team"
prompt: |
  Parse input.csv as RFC-style CSV and write result.json mapping each team to
  the sum of amount, preserving first-seen team order. Quoted commas are data.
  Preserve input.csv and create no other files.
preconditions:
  working_directory: "{sandbox_root}"
  required_tools: [python]
  initial_files:
    - {path: input.csv, content: "team,amount,note\nalpha,3,ok\n\"beta,west\",5,\"has,comma\"\nalpha,4,done\n"}
success_checks:
  - {type: file_unchanged, path: input.csv}
  - {type: json_content_equals, path: result.json, value: {alpha: 7, "beta,west": 5}}
  - {type: no_extra_files}
binary_success_predicate: {authority: "ordered_success_checks_and_common_outcome_rule", aggregation: "all_success_checks_must_pass", timeout_policy: "timeout_or_incomplete_is_failure", manual_rubric_role: "excluded_from_h1"}
timeout_seconds: 240

