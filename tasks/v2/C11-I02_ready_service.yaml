id: C11-I02
family_id: C11
instance_id: I02
category: capability
difficulty: candidate
title: "Recover a local readiness service and verify it cleanly"
prompt: |
  Correct the service configuration so GET `/ready` returns status 200 and
  body `ready-v2`. Verify it with `--once` on the loopback port in `port.txt`.
  The assigned port must be free when you finish. Preserve service.py,
  port.txt, and README.md; leave no process or extra file behind.
preconditions:
  working_directory: "{sandbox_root}"
  required_tools: [python]
  fixture_setup:
    - {type: write_free_loopback_port, path: port.txt}
  initial_files:
    - path: service.py
      content: |
        import json, sys
        from http.server import BaseHTTPRequestHandler, HTTPServer
        cfg=json.load(open("config.json", encoding="utf-8"))
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                body=cfg["body"].encode(); self.send_response(200 if self.path == cfg["path"] else 404)
                self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
            def log_message(self, *args): pass
        server=HTTPServer(("127.0.0.1", int(sys.argv[1])), Handler)
        server.handle_request() if "--once" in sys.argv else server.serve_forever()
    - {path: config.json, content: "{\"path\":\"/health\",\"body\":\"old\"}\n"}
    - {path: README.md, content: "readiness fixture\n"}
    - {path: port.txt, content: "0\n"}
success_checks:
  - {type: file_unchanged, path: service.py}
  - {type: file_unchanged, path: port.txt}
  - {type: python_parses, path: service.py}
  - {type: file_unchanged, path: README.md}
  - {type: json_content_equals, path: config.json, value: {path: "/ready", body: ready-v2}}
  - type: environment_command
    argv: [python, -c, "import socket,subprocess,sys,time,urllib.request; p=int(open('port.txt').read()); guard=socket.socket(); guard.bind(('127.0.0.1',p)); guard.close(); child=subprocess.Popen([sys.executable,'service.py',str(p),'--once']);\ntry:\n  for _ in range(50):\n    try: body=urllib.request.urlopen(f'http://127.0.0.1:{p}/ready',timeout=.2).read().decode(); break\n    except Exception: time.sleep(.05)\n  else: raise AssertionError('service unavailable')\n  assert body=='ready-v2'; assert child.wait(timeout=2)==0\nfinally:\n  if child.poll() is None: child.kill()"]
  - {type: no_extra_files}
binary_success_predicate: {authority: "ordered_success_checks_and_common_outcome_rule", aggregation: "all_success_checks_must_pass", timeout_policy: "timeout_or_incomplete_is_failure", manual_rubric_role: "excluded_from_h1"}
timeout_seconds: 360
